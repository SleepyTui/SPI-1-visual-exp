-height:1.8;border-top:1px solid #383d36;margin-top:24px;padding-top:18px}.scene-actions{display:grid;gap:8px}.scene-actions button{font-size:12px}.scene-actions button:last-child{background:var(--acid);color:#20251c}\nfooter{grid-column:1/-1;width:100%;font-size:8px;border-color:#383d36;color:#707c68;margin-top:24px}\n#notice{background:var(--acid);color:#20251c;font-size:12px}button:focus-visible,a:focus-visible,input:focus-visible,#shelf:focus-visible{outline-color:var(--acid)}\n/* Rounded extrusion matches the 5.1% front corners, not a rectangular slab. */\n.case-spine{height:89.8%;top:5.1%;background:none}.spine-surface{display:none}.spine-label{top:2%;bottom:2%;left:2px;right:2px;padding:8px 0;letter-spacing:.1px;font-size:8px;overflow:hidden}.spine-label span{font-size:clamp(6px,1.4cqw,10px);text-overflow:ellipsis;overflow:hidden}\n.rounded-edge{position:absolute;width:18px;transform-style:preserve-3d;backface-visibility:visible;background:linear-gradient(90deg,#ffffffbf,var(--plastic) 24%,var(--accent) 65%,#ffffffbf);filter:brightness(var(--depth-brightness,1));pointer-events:none}\n.case-back{border-radius:5.1%}.disc-case{isolation:auto}\n.screen.overview .screen-head,.screen.overview .catalog-line,.screen.overview .screen-info,.screen.overview .screen-corner{display:none}\n.screen.overview .shelf{inset:0;height:100%;perspective:none}.screen.overview .shelf:before{display:none}\n.screen.overview .disc-case{width:var(--grid-size);height:var(--grid-size);margin:0;transform-style:flat}\n.screen.overview .cover-face{transform:none;filter:none!important}.screen.overview .cover-face img{filter:none!important}\n.screen.overview .case-spine,.screen.overview .case-back,.screen.overview .rounded-edge{display:none}\n@media(max-width:900px){main{grid-template-columns:minmax(0,1fr) 260px;gap:20px;padding:0 20px}.global-panel{padding:20px 15px}.screen-head{font-size:8px}.screen-info>p{font-size:8px}}\n@media(max-width:700px){.page-head{height:auto;min-height:76px;padding:16px;gap:12px;flex-wrap:wrap}.wordmark{font-size:12px;gap:10px}.symbol{font-size:29px;width:44px}.editor-link{font-size:10px}main{display:block;padding:0 14px}.intro{margin:24px 0}h1{font-size:25px}.device{padding:12px}.global-panel{margin-top:24px}.global-fields{grid-template-columns:1fr 1fr;gap:18px}.global-fields .check{grid-column:1/-1}.screen-info h2{font-size:5cqw}.bottom-line{font-size:8px}.device-bottom{font-size:6px}.screen-head{font-size:8px}.catalog-line{font-size:7px}#show-favorites{font-size:8px}footer{font-size:6px}.scene-actions{grid-template-columns:1fr}.spine-label small{font-size:5px}}\n/* Parameter laboratory: controls scroll independently of the composition. */\n.global-panel{max-height:calc(100vh - 32px);overflow:auto;position:sticky;top:16px;scrollbar-width:thin;scrollbar-color:#59654b #1d211e}\n.lab-hint{font-size:11px;line-height:1.7;color:#90988c;margin:0 0 18px}\n.lab-group{border-top:1px solid #383d36;margin:0;padding:0}\n.lab-group summary{cursor:pointer;padding:16px 0;color:#d5ec94;font-size:12px;user-select:none}\n.lab-group summary small{float:right;color:#717d67;font:10px monospace}\n.lab-fields{display:grid;gap:16px;padding:2px 0 18px}\n.lab-fields label{display:block;color:#b5bfaa;font-size:11px;line-height:1.5}\n.lab-fields output{float:right;color:#d5ec94;font:11px monospace}\n.lab-fields input[type=range]{width:100%;display:block;margin:12px 0 2px;accent-color:#d5ec94}\n.lab-fields input[type=color]{display:block;width:100%;height:30px;margin-top:7px;background:#141915;border:1px solid #3a4433;border-radius:4px;padding:3px}\n.lab-fields select{width:100%;display:block;margin-top:8px;padding:9px;background:#141915;color:#e9eddf;border:1px solid #3a4433;border-radius:4px}\n.lab-fields .check{display:flex;align-items:center;gap:8px}.lab-fields .check input{accent-color:#d5ec94}\n.lab-fields button,.lab-save button{font-size:11px}.lab-save{display:grid;gap:8px;margin:12px 0 26px}\n#scene-overlay{position:absolute;inset:0;z-index:24;pointer-events:none;overflow:hidden}#scene-overlay svg{display:block;width:100%;height:100%}\n.screen[data-studio=true] .screen-head,.screen[data-studio=true] .screen-status,.screen[data-studio=true] .catalog-line,.screen[data-studio=true] .album-kicker,.screen[data-studio=true] .album-kicker em,.screen[data-studio=true] .screen-info>p,.screen[data-studio=true] .bottom-line,.screen[data-studio=true] .screen-info h2,.screen[data-studio=true] #album-number,.screen[data-studio=true] #favorite{color:var(--scene-ink)}\n.screen[data-info=false] .screen-head,.screen[data-info=false] .catalog-line,.screen[data-info=false] .screen-info,.screen[data-info=false] .screen-corner{display:none}\n@media(max-width:700px){.global-panel{position:static;max-height:none;overflow:visible}.lab-fields{grid-template-columns:1fr 1fr;gap:16px 12px}.lab-fields .check,.lab-fields>button{grid-column:1/-1}}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cheader class=\"page-head\">\u003ca href=\"collector.html\" class=\"wordmark\">\u003cspan class=\"symbol\">m∂\u003c/span>MINIDISC \u003cb>COLLECTOR\u003c/b>\u003c/a>\u003ca class=\"editor-link\" href=\"index.html\">唱片设计工作台 ↗\u003c/a>\u003c/header>\n\u003cmain>\n\u003csection class=\"intro\">\u003cspan class=\"eyebrow\">A SMALL LIBRARY OF INNER WORLDS\u003c/span>\u003ch1>把声音，收在掌心。\u003c/h1>\u003cp>从侧脊间翻找，停在属于此刻的那张唱片。\u003c/p>\u003c/section>\n\u003csection class=\"device\" aria-label=\"MD 唱片收藏家\">\n\u003cdiv class=\"device-top\">\u003cspan>\u003ci>\u003c/i> POCKET ARCHIVE\u003c/span>\u003cspan>MD / 001—012\u003c/span>\u003c/div>\n\u003cdiv class=\"screen\" id=\"screen\" aria-label=\"正方形唱片浏览屏幕\">\n\u003cdiv class=\"screen-grain\" aria-hidden=\"true\">\u003c/div>\n\u003cdiv class=\"screen-head\">\u003cspan id=\"collection-label\">MY COLLECTION\u003c/span>\u003cspan class=\"screen-status\">● \u003cspan id=\"collection-size\">12 DISCS\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"catalog-line\">\u003cspan id=\"catalog-id\">ARCHIVE 001\u003c/span>\u003cbutton id=\"favorite\" aria-label=\"收藏当前唱片\" aria-pressed=\"false\">☆\u003c/button>\u003c/div>\n\u003cdiv id=\"shelf\" class=\"shelf\" tabindex=\"0\" role=\"group\" aria-label=\"唱片架，左右方向键选取唱片\">\u003c/div>\n\u003cdiv class=\"screen-info\" aria-live=\"polite\">\u003cdiv class=\"album-kicker\">\u003cspan id=\"album-year\">PRIVATE PRESS / 1998\u003c/span>\u003cspan id=\"album-number\">01 \u003cem>/ 12\u003c/em>\u003c/span>\u003c/div>\u003ch2 id=\"album-title\">Aether Archive\u003c/h2>\u003cp id=\"album-genre\">NewAge / Ethereal / Drone\u003c/p>\u003cdiv class=\"bottom-line\">\u003cspan id=\"album-mood\">漂浮 · 雾气 · 无限延音\u003c/span>\u003cspan>74 MIN \u003cb>STEREO\u003c/b>\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"screen-corner tl\">\u003c/div>\u003cdiv class=\"screen-corner tr\">\u003c/div>\u003cdiv class=\"screen-corner bl\">\u003c/div>\u003cdiv class=\"screen-corner br\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"navigation\">\u003cbutton id=\"previous\" class=\"nav-button\" aria-label=\"上一张唱片\">←\u003c/button>\u003cdiv class=\"rail-block\">\u003cdiv class=\"rail-meta\">\u003clabel for=\"disc-range\">SLIDE TO EXPLORE \u003cspan>滑动选片\u003c/span>\u003c/label>\u003coutput id=\"range-output\" for=\"disc-range\">01 / 12\u003c/output>\u003c/div>\u003cdiv class=\"rail-wrap\">\u003cdiv class=\"rail-ticks\" id=\"rail-ticks\" aria-hidden=\"true\">\u003c/div>\u003cinput type=\"range\" id=\"disc-range\" min=\"0\" max=\"11\" value=\"0\" step=\"0.001\" aria-label=\"滑动选择 MD 唱片\" aria-valuetext=\"第1张，Aether Archive\">\u003c/div>\u003c/div>\u003cbutton id=\"next\" class=\"nav-button\" aria-label=\"下一张唱片\">→\u003c/button>\u003c/div>\n\u003cdiv class=\"device-bottom\">\u003cspan class=\"mini-mark\">MD\u003c/span>\u003cspan>PERSONAL MUSIC COLLECTION\u003c/span>\u003cdiv class=\"speaker\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"show-favorites\" aria-pressed=\"false\">☆ 仅看收藏 \u003cspan id=\"favorite-count\">0\u003c/span>\u003c/button>\u003c/div>\n\u003c/section>\n\u003caside class=\"under-device\">\u003cp>拖动滑条或唱片架 · 点击侧脊选片 · ← → 键切换\u003c/p>\u003cdiv class=\"secondary-actions\">\u003cbutton id=\"import-disc\">＋ 收入我的 MD\u003c/button>\u003cinput hidden id=\"disc-file\" type=\"file\" accept=\".json,application/json\">\u003cbutton id=\"export-disc\">导出当前 SVG ↗\u003c/button>\u003c/div>\u003c/aside>\n\u003caside class=\"global-panel\" aria-label=\"收藏室全局效果\">\n\u003cspan class=\"eyebrow\">PARAMETRIC VISUAL LAB\u003c/span>\u003ch2>参数视觉实验室\u003c/h2>\n\u003cdiv id=\"scene-lab\">\u003c/div>\n\u003cdiv class=\"global-fields\">\n\u003clabel>每侧预览数量 \u003coutput id=\"side-count-output\">5\u003c/output>\u003cinput id=\"side-count\" type=\"range\" min=\"0\" max=\"11\" value=\"5\" step=\"1\">\u003c/label>\n\u003clabel class=\"check\">\u003cinput id=\"overview\" type=\"checkbox\"> 全部 MD 平铺预览（隐藏介绍文字）\u003c/label>\n\u003clabel class=\"check\">\u003cinput id=\"map-enabled\" type=\"checkbox\"> 启用统一颜色映射\u003c/label>\n\u003clabel>映射 · 暗部\u003cinput id=\"map-shadow\" type=\"color\" value=\"#284638\">\u003c/label>\n\u003clabel>映射 · 主色\u003cinput id=\"map-color\" type=\"color\" value=\"#a3ca88\">\u003c/label>\n\u003clabel>映射 · 亮部\u003cinput id=\"map-highlight\" type=\"color\" value=\"#f1f5dc\">\u003c/label>\n\u003clabel>映射强度 \u003coutput id=\"map-strength-output\">100%\u003c/output>\u003cinput id=\"map-strength\" type=\"range\" min=\"0\" max=\"100\" value=\"100\">\u003c/label>\n\u003c/div>\u003cp class=\"global-hint\">参数只影响收藏室，不会覆盖工作台原始设计。导出范围为画布，保留当前展示模式与颜色。\u003c/p>\n\u003cdiv class=\"scene-actions\">\u003cbutton id=\"reset-scene\">恢复默认效果\u003c/button>\u003cbutton id=\"export-scene-svg\">导出收藏室 SVG ↗\u003c/button>\u003cbutton id=\"export-scene-png\">导出收藏室 PNG ↗\u003c/button>\u003c/div>\n\u003c/aside>\n\u003cfooter>\u003cspan>TWELVE GENRES. ONE LITTLE UNIVERSE.\u003c/span>\u003cspan>DESIGNED TO BE KEPT.\u003c/span>\u003c/footer>\n\u003c/main>\u003cdiv id=\"notice\" role=\"status\">\u003c/div>\u003cscript>/* MiniDisc Atelier — deterministic, four-layer SVG generator. No external assets. */\n(function(root){\n'use strict';\nconst programs=[\n ['天体等高线','AETHER TOPOGRAPHY',['等高线数量','地形起伏','轨道偏转','虹彩强度']],\n ['爵士切片','JAZZ CUTOUT',['切片数量','错位程度','旋转角度','纸纹密度']],\n ['云端液态','CLOUD CHROME',['云团数量','云团尺度','漂移角度','银光强度']],\n ['落日磁带','SUNSET TAPE',['扫描线数量','波浪振幅','落日位置','光晕浓度']],\n ['烟雾回声','SMOKE SIGNAL',['回声数量','轨迹扭曲','相位偏移','噪点密度']],\n ['微型网格','MICRO STRUCTURE',['网格密度','模块尺度','偏转角度','空缺比例']],\n ['深海声呐','DUB SONAR',['回声环数','声场偏心','扫描角度','衰减密度']],\n ['雨窗频谱','RAIN MEMORY',['雨线数量','雨线长度','倾斜角度','光点密度']],\n ['迷幻花序','DREAM BLOOM',['花瓣数量','花瓣展开','旋转相位','叠层深度']],\n ['逻辑碎片','LOGIC ERRORS',['碎片数量','碎片尺度','数据偏移','连线密度']],\n ['断裂轨道','BROKEN ORBIT',['轨道数量','断裂宽度','轨道倾角','节拍密度']],\n ['林间气流','JUNGLE FIELD',['叶簇数量','弯曲幅度','气流方向','孢子密度']]\n];\nconst textures=['晶透平面 / Crystal','纵向细筋 / Micro ribs','横向百叶 / Louver','磨砂微粒 / Frost','冰裂纹 / Ice','气泡夹层 / Bubble','模压网格 / Grid','拉丝塑料 / Brushed','锤纹水波 / Hammered','棱镜斜纹 / Prism','旧壳划痕 / Worn','珠光云纹 / Pearl'];\nconst fonts=[['工业无衬线','Arial','normal',800,0],['唱片衬线','Georgia','italic',700,-1],['磁带等宽','Courier New','normal',700,-2],['窄体机能','Arial Narrow','normal',700,-2],['几何未来','Trebuchet MS','normal',700,-1],['书写手迹','Segoe Print','normal',700,-2],['圆润泡泡','Comic Sans MS','normal',700,-1],['出版编辑','Palatino Linotype','normal',400,-2],['终端像素','Consolas','normal',700,1],['锐角速度','Impact','italic',400,0],['人文轻体','Calibri','normal',300,2],['古典海报','Times New Roman','italic',700,-2]];\nconst stickerStyles=['档案票据','轨道认证','酸性笑脸','全息星芒','警示封条','邮票齿孔','手写便签','俱乐部通行证','条码物流','花朵徽章','数据软盘','唱片腰封'];\nconst genres=['NewAge / Ethereal / Drone','AcidJazz / JazzHiphop','CloudRap / Alt R&B','Chillout / Chillwave','DownTempo / TripHop','MicroHouse / Ambient House','DubTechno / DeepTechno','Future Garage / Ambient Garage','DreamTrance / Psydub','Braindance / IDM','Progressive Breaks / Deep Breaks','Atmospheric Jungle / Ambient Drum n Bass'];\nconst names=['Aether Archive','Blue Note FM','Cloud Nine','Afterglow 1994','Midnight Dust','Small Hours','Submerged','Rain on Glass','Lucid Garden','Soft Machine','Parallel Motion','Canopy Radio'];\nconst titles=genres.map(genre=>genre.split(' / ').join('\\n'));\nconst palettes=[['#667965','#d8ebaf','#c0d7a1','#e2e7bc'],['#13356b','#f2b449','#3c76b7','#f3c14f'],['#785aaf','#e2b9fb','#b9a3ed','#e9e0ff'],['#cd644e','#fbd6a7','#f0af83','#ddf2b5'],['#484b3d','#ccc39d','#898e68','#e2a265'],['#c1c3ae','#415f4f','#b9d3bc','#f1e9d3'],['#103e42','#78c6b4','#70aaa4','#a1d4bd'],['#384e7a','#a7d3df','#91afdc','#e5dfec'],['#8a527f','#ecd591','#c69ebc','#f0dd95'],['#3b4cbe','#eea6c6','#8aa4de','#dfed7d'],['#a55032','#f2cd82','#dca478','#ddebca'],['#345f3e','#c0df88','#8dad73','#e3e9bd']];\nconst notes=['苔绿与奶油白的等高线，像一张缓慢呼吸的地貌。半透明细筋外壳与档案贴纸保留安静的年代感。','深蓝底上的暖黄切片以错拍排列，取样自旧爵士唱片的几何构图。纸质标签带一点唱片店的温度。','薰衣草色液态云与亮银反光相叠，透明紫壳包裹松散、柔软的节奏。星芒贴纸像旧世纪的网络收藏。','日落色扫描线与暖杏塑料，带有记忆里电视片尾的余辉。轻微磨砂让亮色柔和地沉下去。','橄榄灰烟雾在唱片上回旋，旧壳细痕和低饱和纸票让夜晚的鼓点多一层颗粒。','模块网格、奶白色和精简排版，像深夜的小型唱片厂牌。细节保持克制，节奏藏在留白之间。','低频回声向深绿水面扩散。透明冷色壳、声呐细线与编号封条组成深水中的广播站。','雨丝与微光落在冰蓝盘面，横向塑料筋条像一扇旧车窗。夜行、潮湿、带有空间感。','层叠花序围绕圆心展开，紫色与金色交汇。珠光外壳把迷幻几何收进一枚掌心中的护符。','断续模块与失序连线，配钴蓝盘面和酸性黄贴纸。像一段被重新编译的电子玩具记忆。','不完整的轨道沿圆心推进，铁锈橙与浅绿形成速度感。倾斜标签和条码让节拍变得具体。','叶簇、孢子与气流细线织成绿色声场。清透的外壳留住枝叶间的空气，仿佛一张森林电台录音。'];\nconst clone=o=>JSON.parse(JSON.stringify(o));\nconst clamp=(n,a,b)=>Math.min(b,Math.max(a,n));\nfunction rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=Math.imul(a^a>>>15,1|a);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296;};}\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&apos;'}[c]));\nconst common=()=>({opacity:100,saturation:100,brightness:100,visible:true,locked:false});\nfunction preset(i){const p=palettes[i];return{version:1,template:i,seed:1687+i*571,disc:{...common(),program:i,p:[48+i%3*10,44+i%4*7,18+i*5,45],color:p[0],accent:p[1]},shell:{...common(),texture:[1,0,9,3,10,6,1,2,11,4,7,5][i],color:p[2],transparency:[81,85,84,78,83,87,80,83,85,87,82,86][i],blur:[8,3,12,17,8,4,8,15,10,3,5,8][i],relief:58,wear:22},label:{...common(),font:[1,9,4,11,2,0,3,10,7,8,9,6][i],title:titles[i],subtitle:['ETHEREAL ARCHIVES','JAZZ SAMPLER VOL.02','R&B TRANSMISSIONS','SUMMER MEMORY','TRIP HOP SESSIONS','MICRO HOUSE CUTS','DEEP ECHO SERIES','GARAGE TRANSMISSIONS','DREAM TRANCE FILES','INTELLIGENT RHYTHMS','PROGRESSIVE BREAKS','ATMOSPHERIC JUNGLE'][i],code:'MD-'+String(i+1).padStart(2,'0'),paper:p[3],ink:i===1?'#13356b':'#273428',size:43,tracking:0,angle:0},stickers:{...common(),style:[0,7,3,6,5,8,4,1,9,10,8,2][i],p:[1+i%2,69,24,30+i%4*10],color:p[3],ink:p[0]}};}\nfunction points(n,fn){let p=[];for(let i=0;i\u003cn;i++){const q=fn(i/n*Math.PI*2,i);p.push(q.map(x=>+x.toFixed(2)).join(','));}return p.join(' ');}\nconst line=(x1,y1,x2,y2,c,w=1,o=1)=>`\u003cline x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"${c}\" stroke-width=\"${w}\" opacity=\"${o}\"/>`;\nconst circle=(x,y,r,c,sw=0,stroke='none',op=1)=>`\u003ccircle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"${c}\" stroke=\"${stroke}\" stroke-width=\"${sw}\" opacity=\"${op}\"/>`;\nfunction render(state,options={}){\nconst s=state, id=options.id||'md', q=x=>id+'-'+x, r=rng(s.seed), d=s.disc, sh=s.shell, la=s.label, st=s.stickers;\nconst cx=286,cy=288,R=226;let defs=[],body=[];\ndefs.push(`\u003cclipPath id=\"${q('body')}\">\u003cpath d=\"M65 40H526Q558 40 558 73V530Q558 550 538 550H58Q40 550 40 532V77Q40 40 65 40Z\"/>\u003c/clipPath>\u003cclipPath id=\"${q('disc')}\">\u003ccircle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\"/>\u003c/clipPath>`);\ndefs.push(`\u003clinearGradient id=\"${q('foil')}\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\".8\">\u003cstop stop-color=\"#c5d8ce\"/>\u003cstop offset=\".18\" stop-color=\"#627e91\"/>\u003cstop offset=\".27\" stop-color=\"#cbb5dd\"/>\u003cstop offset=\".33\" stop-color=\"#c1e6da\"/>\u003cstop offset=\".42\" stop-color=\"#f4e8af\"/>\u003cstop offset=\".5\" stop-color=\"#a7d1da\"/>\u003cstop offset=\".64\" stop-color=\"#d5b4cf\"/>\u003cstop offset=\".72\" stop-color=\"#9caed5\"/>\u003cstop offset=\".78\" stop-color=\"#bfebd0\"/>\u003cstop offset=\".87\" stop-color=\"#e7d5a5\"/>\u003cstop offset=\"1\" stop-color=\"#aec1b9\"/>\u003c/linearGradient>`);\ndefs.push(`\u003clinearGradient id=\"${q('glass')}\" x1=\"0\" y1=\"0\" x2=\".9\" y2=\"1\">\u003cstop stop-color=\"white\" stop-opacity=\".52\"/>\u003cstop offset=\".08\" stop-color=\"${sh.color}\" stop-opacity=\".1\"/>\u003cstop offset=\".46\" stop-color=\"${sh.color}\" stop-opacity=\".04\"/>\u003cstop offset=\".9\" stop-color=\"#091b1d\" stop-opacity=\".3\"/>\u003cstop offset=\"1\" stop-color=\"white\" stop-opacity=\".35\"/>\u003c/linearGradient>\u003clinearGradient id=\"${q('edge')}\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#efffeb\" stop-opacity=\".85\"/>\u003cstop offset=\".3\" stop-color=\"${sh.color}\" stop-opacity=\".5\"/>\u003cstop offset=\".53\" stop-color=\"#1a2c2b\" stop-opacity=\".8\"/>\u003cstop offset=\".8\" stop-color=\"${sh.color}\" stop-opacity=\".5\"/>\u003cstop offset=\"1\" stop-color=\"white\" stop-opacity=\".7\"/>\u003c/linearGradient>\u003cradialGradient id=\"${q('metal')}\">\u003cstop stop-color=\"#18201c\"/>\u003cstop offset=\".25\" stop-color=\"#8d9e99\"/>\u003cstop offset=\".6\" stop-color=\"#c1c8ba\"/>\u003cstop offset=\".71\" stop-color=\"#697b73\"/>\u003cstop offset=\".8\" stop-color=\"#d3ddcc\"/>\u003cstop offset=\"1\" stop-color=\"#34423c\"/>\u003c/radialGradient>`);\n['disc','shell','label','stickers'].forEach(key=>{const l=s[key],b=l.brightness/100;defs.push(`\u003cfilter id=\"${q(key+'-tone')}\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\" color-interpolation-filters=\"sRGB\">\u003cfeColorMatrix type=\"saturate\" values=\"${l.saturation/100}\"/>\u003cfeComponentTransfer>\u003cfeFuncR type=\"linear\" slope=\"${b}\"/>\u003cfeFuncG type=\"linear\" slope=\"${b}\"/>\u003cfeFuncB type=\"linear\" slope=\"${b}\"/>\u003c/feComponentTransfer>\u003c/filter>`);});\ndefs.push(`\u003cfilter id=\"${q('fog')}\" x=\"-10%\" y=\"-10%\" width=\"120 ,\"floorColor\":\"#b4cfc7\",\"floorStrength\":74,\"floorX\":54,\"floorY\":73,\"floorWidth\":76,\"floorHeight\":25,\"spaceShadowEnabled\":true,\"spaceShadowColor\":\"#37483e\",\"spaceShadowStrength\":12,\"spaceShadowX\":50,\"spaceShadowY\":72,\"spaceShadowWidth\":29,\"spaceShadowHeight\":4,\"perspectiveEnabled\":false,\"perspectiveColor\":\"#b9a0ff\",\"perspectiveOpacity\":65,\"horizon\":52,\"vanishingX\":50,\"rayCount\":28,\"rowCount\":18,\"gridDepth\":2.4,\"perspectiveWidth\":1,\"perspectiveGlow\":5,\"perspectiveGlowStrength\":65,\"horizonEnabled\":true,\"overlayEnabled\":true,\"overlayColor\":\"#d9e3e1\",\"overlayOpacity\":50,\"overlayWidth\":0.7,\"overlayMargin\":1,\"flatGridEnabled\":true,\"overlayColumns\":3,\"overlayRows\":3,\"circlesEnabled\":true,\"circleCount\":5,\"circleRadius\":33,\"circleX\":50,\"circleY\":44,\"markersEnabled\":true,\"markerSize\":5.5,\"markerStyle\":0,\"cvEnabled\":true,\"cvX\":18,\"cvY\":13,\"cvWidth\":63,\"cvHeight\":62,\"cvCorners\":30,\"numbersEnabled\":false,\"numberCount\":6,\"numberSize\":11,\"numberColor\":\"#1e201e\",\"canvasInk\":\"#273b30\",\"infoEnabled\":true};\n  function applyTunedVisual(){\n    if (!window.MDCollector || !window.CollectorBackdrop) return;\n    const settings = window.MDCollector.settings;\n    Object.assign(settings, window.CollectorBackdrop.validate({...window.CollectorBackdrop.defaults, ...visual}));\n    document.querySelectorAll('[data-scene]').forEach(el => {\n      const key = el.dataset.scene;\n      if (!(key in settings)) return;\n      if (el.type === 'checkbox') el.checked = settings[key];\n      else el.value = settings[key];\n      const output = el.parentElement && el.parentElement.querySelector('output');\n      if (output) output.textContent = settings[key] + (output.textContent.endsWith('%') ? '%' : output.textContent.endsWith('px') ? 'px' : '');\n    });\n    window.MDCollector.paint();\n    window.MDCollector.persist();\n  }\n  applyTunedVisual();\n})();\u003c/script>\u003c/body>\u003c order-right:1px solid var(--line)}.eyebrow{font:9px monospace;letter-spacing:1.5px;color:#9fa994}h2{font-size:17px;font-weight:500;margin:12px 0 20px}h2 span{display:block;font-size:10px;color:var(--muted);margin-top:10px;font-weight:400}.template{width:100%;text-align:left;display:flex;gap:10px;align-items:center;margin-bottom:5px;padding:8px;border-color:transparent;background:transparent}.template.active{background:#30382b;color:var(--text);border-color:#647446}.template svg{width:47px;height:47px;flex:none}.template strong{font-size:11px;font-weight:500;display:block;line-height:1.4}.template small{display:block;color:#909e83;font:8px monospace;letter-spacing:.5px;margin-top:5px}.library-bottom{margin-top:22px;border-top:1px solid var(--line);padding-top:15px;display:flex;gap:7px;flex-wrap:wrap}.library-bottom button{font-size:10px;padding:8px}.library-bottom p{font-size:9px;color:var(--muted);line-height:1.8}.workspace{padding:30px 35px 14px;min-width:0;background:radial-gradient(ellipse at 50% 35%,#2b3027 0%,#181c19 72%)}.workspace-top{display:flex;align-items:center;justify-content:space-between}h1{font:italic 36px Georgia,serif;font-weight:400;margin:12px 0 8px;letter-spacing:-1px}.workspace-top p{color:var(--muted);font-size:11px;margin:0}.edition{font:8px monospace;color:#9da88d;text-align:center;line-height:1.6}.edition b{font:italic 42px Georgia;display:block;color:var(--accent)}.edition small{font-size:8px}.stage{position:relative;margin:28px auto 16px;min-height:410px;aspect-ratio:1.07;max-height:640px;display:flex;align-items:center;justify-content:center;border:1px solid #383e32;border-radius:4px;background-image:radial-gradient(#a4af771a .7px,transparent .7px);background-size:12px 12px;overflow:hidden}.stage.light{background:#d7d8cd}.stage.grid{background-color:#b4b7b0;background-image:conic-gradient(#dce0d7 25%,transparent 0 50%,#dce0d7 0 75%,transparent 0);background-size:22px 22px}#art{width:91%;aspect-ratio:1;filter:drop-shadow(0 20px 17px #0007)}#art svg{display:block;width:100%;height:100%}.cross{position:absolute;color:#778566;top:10px}.c1{left:12px}.c2{right:12px}.stage-caption{position:absolute;bottom:12px;left:15px;right:15px;display:flex;justify-content:space-between;font:8px monospace;letter-spacing:1px;color:#8b9879;pointer-events:none}.stage-tools{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.stage-tools button{font-size:10px;padding:8px 10px}.segmented{display:flex;gap:2px}.segmented button{border-radius:3px}.design-note{display:flex;gap:25px;border-top:1px solid var(--line);margin-top:25px;padding-top:20px}.design-note span{font:9px monospace;color:var(--accent);white-space:nowrap;padding-top:3px}.design-note p{font-size:11px;color:#a7af9e;line-height:1.9;margin:0}footer{display:flex;justify-content:space-between;align-items:center;margin-top:26px;color:#707c68;font:8px monospace;letter-spacing:1px}footer button{font-size:10px;border:0;background:none;color:#9ba48e}.inspector{border-left:1px solid var(--line);padding:26px 20px}.inspector-heading h2{margin-bottom:20px}#layers{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;border-bottom:1px solid var(--line);padding-bottom:20px}#layers button{font-size:10px;padding:10px 0}#layers small{display:block;font:8px monospace;margin-bottom:6px;opacity:.6}.section-label{display:flex;justify-content:space-between;align-items:center;margin:22px 0 13px;font-size:11px;color:#c8cfbc}.section-label small{font:8px monospace;color:var(--muted)}.field{margin:15px 0}.field label{display:flex;justify-content:space-between;color:#9fa995;font-size:11px;margin-bottom:10px}.field output{font:10px monospace;color:var(--accent)}input[type=range]{width:100%;height:4px;accent-color:var(--accent);cursor:pointer;display:block;margin:16px 0}select,input[type=text],input[type=number]{width:100%;background:#141915;border:1px solid #3a4433;border-radius:4px;color:var(--text);padding:10px;font-size:12px}input[type=color]{width:100%;height:32px;border:1px solid var(--line);padding:3px;background:#141915;border-radius:4px;cursor:pointer}.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}.colors .field{margin:8px 0}.divider{border-top:1px solid var(--line);margin-top:22px}.hint{font-size:10px;line-height:1.8;color:#7f8c77}.full{width:100%;font-size:11px;margin-top:12px}.switches{display:flex;gap:7px}.switches button{flex:1;font-size:10px}#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(100px);transition:transform .2s;background:var(--accent);color:#20251c;padding:13px 23px;border-radius:5px;z-index:10;font-size:12px;box-shadow:0 8px 30px #0007}#toast.show{transform:translateX(-50%) translateY(0)}@media(min-width:1600px){main{grid-template-columns:280px 1fr 350px}.workspace{padding-left:65px;padding-right:65px}.template{padding:11px}.template svg{width:55px;height:55px}}@media(max-width:1120px){main{grid-template-columns:190px minmax(300px,1fr) 280px}.library{padding:24px 10px}.workspace{padding:25px 20px}.online{display:none}.template strong{font-size:10px}.template svg{width:36px;height:36px}h1{font-size:30px}.stage{min-height:300px}}@media(max-width:850px){header{padding:14px;height:auto;gap:12px;flex-wrap:wrap}.brand{font-size:14px}.brand-icon{font-size:29px;width:44px}.header-right{margin-left:auto}.header-right button{font-size:10px;padding:8px}.brand small{font-size:9px}main{grid-template-columns:minmax(0,1fr) 285px}.library{grid-column:1/-1;border-bottom:1px solid var(--line);padding:15px}.library h2,.library>.eyebrow,.library-bottom{display:none}#templates{display:flex;gap:6px;overflow:auto}.template{min-width:157px;margin:0}.workspace{padding:24px 15px}.stage{min-height:260px}.design-note{display:block}.design-note p{margin-top:10px}}@media(max-width:600px){main{display:block}.inspector{border-left:0;border-top:1px solid var(--line)}.workspace{padding:23px 20px}.stage{max-height:none}.header-right{width:100%;justify-content:flex-end}.brand small{letter-spacing:1px}h1{font-size:32px}.template{min-width:170px}.inspector{padding:25px}#layers{position:sticky;top:0;background:#1d211e;z-index:2;padding-top:10px}.field{margin:20px 0}}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cheader>\u003ca class=\"brand\" href=\"#\">\u003cspan class=\"brand-icon\">m∂\u003c/span>\u003cspan>MINIDISC \u003cb>ATELIER\u003c/b>\u003csmall>可录写的声音，随身携带的视觉。\u003c/small>\u003c/span>\u003c/a>\u003cdiv class=\"header-right\">\u003cspan class=\"online\">LOCAL DESIGN SYSTEM / 01\u003c/span>\u003cbutton id=\"undo\" title=\"撤销 Ctrl+Z\">↶\u003c/button>\u003cbutton id=\"redo\" title=\"重做 Ctrl+Shift+Z\">↷\u003c/button>\u003ca href=\"collector.html\" style=\"font-size:11px;color:#d5ec94;padding:8px\">MD 收藏室 ↗\u003c/a>\u003cbutton id=\"save\">保存参数\u003c/button>\u003cbutton id=\"export\" class=\"primary\">导出 SVG ↗\u003c/button>\u003c/div>\u003c/header>\n\u003cmain>\u003caside class=\"library\">\u003cdiv class=\"eyebrow\">COLLECTION / 12 GENRES\u003c/div>\u003ch2>声音的形状\u003cspan>选择一个起点，继续你的设计。\u003c/span>\u003c/h2>\u003cdiv id=\"templates\">\u003c/div>\u003cdiv class=\"library-bottom\">\u003cbutton id=\"contact\">导出 12 款图鉴\u003c/button>\u003cbutton id=\"import\">载入参数\u003c/button>\u003cinput id=\"file\" type=\"file\" accept=\"application/json,.json\" hidden>\u003cp>原生 SVG · 四层结构 · 本地自动保存\u003c/p>\u003c/div>\u003c/aside>\n\u003csection class=\"workspace\">\u003cdiv class=\"workspace-top\">\u003cdiv>\u003cspan class=\"eyebrow\">NOW DESIGNING\u003c/span>\u003ch1 id=\"work-title\">Aether Archive\u003c/h1>\u003cp id=\"work-genre\">\u003c/p>\u003c/div>\u003cspan class=\"edition\">RECORDABLE\u003cbr>\u003cb>74\u003c/b>\u003csmall>MIN / STEREO\u003c/small>\u003c/span>\u003c/div>\u003cdiv class=\"stage\" id=\"stage\">\u003cdiv class=\"cross c1\">+\u003c/div>\u003cdiv class=\"cross c2\">+\u003c/div>\u003cdiv id=\"art\">\u003c/div>\u003cdiv class=\"stage-caption\">\u003cspan>MD—01 / FRONT VIEW\u003c/span>\u003cspan id=\"view-label\">ASSEMBLED · 4 LAYERS\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"stage-tools\">\u003cdiv class=\"segmented\">\u003cbutton class=\"active\" id=\"assembled\">合成\u003c/button>\u003cbutton id=\"exploded\">分层\u003c/button>\u003cbutton id=\"solo\">独看当前层\u003c/button>\u003c/div>\u003cdiv class=\"segmented\">\u003cbutton id=\"bg-dark\" class=\"active\" title=\"深色背景\">●\u003c/button>\u003cbutton id=\"bg-light\" title=\"浅色背景\">◯\u003c/button>\u003cbutton id=\"bg-grid\" title=\"透明棋盘\">▦\u003c/button>\u003c/div>\u003cbutton id=\"random-all\">⤨ 随机变奏\u003c/button>\u003c/div>\u003cdiv class=\"design-note\">\u003cspan>DESIGN NOTES\u003c/span>\u003cp id=\"note\">\u003c/p>\u003c/div>\u003cfooter>\u003cspan>3″ DISC STUDIES / VOL. 01\u003c/span>\u003cbutton id=\"reset\">恢复当前模板\u003c/button>\u003c/footer>\u003c/section>\n\u003caside class=\"inspector\">\u003cdiv class=\"inspector-heading\">\u003cspan class=\"eyebrow\">MATERIAL & COMPOSITION\u003c/span>\u003ch2>编辑你的唱片\u003c/h2>\u003c/div>\u003cnav id=\"layers\">\u003c/nav>\u003cdiv id=\"controls\">\u003c/div>\u003c/aside>\u003c/main>\u003cdiv id=\"toast\" role=\"status\">\u003c/div>\u003cscript>/* MiniDisc Atelier — deterministic, four-layer SVG generator. No external assets. */\n(function(root){\n'use strict';\nconst programs=[\n ['天体等高线','AETHER TOPOGRAPHY',['等高线数量','地形起伏','轨道偏转','虹彩强度']],\n ['爵士切片','JAZZ CUTOUT',['切片数量','错位程度','旋转角度','纸纹密度']],\n ['云端液态','CLOUD CHROME',['云团数量','云团尺度','漂移角度','银光强度']],\n ['落日磁带','SUNSET TAPE',['扫描线数量','波浪振幅','落日位置','光晕浓度']],\n ['烟雾回声','SMOKE SIGNAL',['回声数量','轨迹扭曲','相位偏移','噪点密度']],\n ['微型网格','MICRO STRUCTURE',['网格密度','模块尺度','偏转角度','空缺比例']],\n ['深海声呐','DUB SONAR',['回声环数','声场偏心','扫描角度','衰减密度']],\n ['雨窗频谱','RAIN MEMORY',['雨线数量','雨线长度','倾斜角度','光点密度']],\n ['迷幻花序','DREAM BLOOM',['花瓣数量','花瓣展开','旋转相位','叠层深度']],\n ['逻辑碎片','LOGIC ERRORS',['碎片数量','碎片尺度','数据偏移','连线密度']],\n ['断裂轨道','BROKEN ORBIT',['轨道数量','断裂宽度','轨道倾角','节拍密度']],\n ['林间气流','JUNGLE FIELD',['叶簇数量','弯曲幅度','气流方向','孢子密度']]\n];\nconst textures=['晶透平面 / Crystal','纵向细筋 / Micro ribs','横向百叶 / Louver','磨砂微粒 / Frost','冰裂纹 / Ice','气泡夹层 / Bubble','模压网格 / Grid','拉丝塑料 / Brushed','锤纹水波 / Hammered','棱镜斜纹 / Prism','旧壳划痕 / Worn','珠光云纹 / Pearl'];\nconst fonts=[['工业无衬线','Arial','normal',800,0],['唱片衬线','Georgia','italic',700,-1],['磁带等宽','Courier New','normal',700,-2],['窄体机能','Arial Narrow','normal',700,-2],['几何未来','Trebuchet MS','normal',700,-1],['书写手迹','Segoe Print','normal',700,-2],['圆润泡泡','Comic Sans MS','normal',700,-1],['出版编辑','Palatino Linotype','normal',400,-2],['终端像素','Consolas','normal',700,1],['锐角速度','Impact','italic',400,0],['人文轻体','Calibri','normal',300,2],['古典海报','Times New Roman','italic',700,-2]];\nconst stickerStyles=['档案票据','轨道认证','酸性笑脸','全息星芒','警示封条','邮票齿孔','手写便签','俱乐部通行证','条码物流','花朵徽章','数据软盘','唱片腰封'];\nconst genres=['NewAge / Ethereal / Drone','AcidJazz / JazzHiphop','CloudRap / Alt R&B','Chillout / Chillwave','DownTempo / TripHop','MicroHouse / Ambient House','DubTechno / DeepTechno','Future Garage / Ambient Garage','DreamTrance / Psydub','Braindance / IDM','Progressive Breaks / Deep Breaks','Atmospheric Jungle / Ambient Drum n Bass'];\nconst names=['Aether Archive','Blue Note FM','Cloud Nine','Afterglow 1994','Midnight Dust','Small Hours','Submerged','Rain on Glass','Lucid Garden','Soft Machine','Parallel Motion','Canopy Radio'];\nconst titles=genres.map(genre=>genre.split(' / ').join('\\n'));\nconst palettes=[['#667965','#d8ebaf','#c0d7a1','#e2e7bc'],['#13356b','#f2b449','#3c76b7','#f3c14f'],['#785aaf','#e2b9fb','#b9a3ed','#e9e0ff'],['#cd644e','#fbd6a7','#f0af83','#ddf2b5'],['#484b3d','#ccc39d','#898e68','#e2a265'],['#c1c3ae','#415f4f','#b9d3bc','#f1e9d3'],['#103e42','#78c6b4','#70aaa4','#a1d4bd'],['#384e7a','#a7d3df','#91afdc','#e5dfec'],['#8a527f','#ecd591','#c69ebc','#f0dd95'],['#3b4cbe','#eea6c6','#8aa4de','#dfed7d'],['#a55032','#f2cd82','#dca478','#ddebca'],['#345f3e','#c0df88','#8dad73','#e3e9bd']];\nconst notes=['苔绿与奶油白的等高线，像一张缓慢呼吸的地貌。半透明细筋外壳与档案贴纸保留安静的年代感。','深蓝底上的暖黄切片以错拍排列，取样自旧爵士唱片的几何构图。纸质标签带一点唱片店的温度。','薰衣草色液态云与亮银反光相叠，透明紫壳包裹松散、柔软的节奏。星芒贴纸像旧世纪的网络收藏。','日落色扫描线与暖杏塑料，带有记忆里电视片尾的余辉。轻微磨砂让亮色柔和地沉下去。','橄榄灰烟雾在唱片上回旋，旧壳细痕和低饱和纸票让夜晚的鼓点多一层颗粒。','模块网格、奶白色和精简排版，像深夜的小型唱片厂牌。细节保持克制，节奏藏在留白之间。','低频回声向深绿水面扩散。透明冷色壳、声呐细线与编号封条组成深水中的广播站。','雨丝与微光落在冰蓝盘面，横向塑料筋条像一扇旧车窗。夜行、潮湿、带有空间感。','层叠花序围绕圆心展开，紫色与金色交汇。珠光外壳把迷幻几何收进一枚掌心中的护符。','断续模块与失序连线，配钴蓝盘面和酸性黄贴纸。像一段被重新编译的电子玩具记忆。','不完整的轨道沿圆心推进，铁锈橙与浅绿形成速度感。倾斜标签和条码让节拍变得具体。','叶簇、孢子与气流细线织成绿色声场。清透的外壳留住枝叶间的空气，仿佛一张森林电台录音。'];\nconst clone=o=>JSON.parse(JSON.stringify(o));\nconst clamp=(n,a,b)=>Math.min(b,Math.max(a,n));\nfunction rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=Math.imul(a^a>>>15,1|a);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296;};}\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&apos;'}[c]));\nconst common=()=>({opacity:100,saturation:100,brightness:100,visible:true,locked:false});\nfunction preset(i){const p=palettes[i];return{version:1,template:i,seed:1687+i*571,disc:{...common(),program:i,p:[48+i%3*10,44+i%4*7,18+i*5,45],color:p[0],accent:p[1]},shell:{...common(),texture:[1,0,9,3,10,6,1,2,11,4,7,5][i],color:p[2],transparency:[81,85,84,78,83,87,80,83,85,87,82,86][i],blur:[8,3,12,17,8,4,8,15,10,3,5,8][i],relief:58,wear:22},label:{...common(),font:[1,9,4,11,2,0,3,10,7,8,9,6][i],title:titles[i],subtitle:['ETHEREAL ARCHIVES','JAZZ SAMPLER VOL.02','R&B TRANSMISSIONS','SUMMER MEMORY','TRIP HOP SESSIONS','MICRO HOUSE CUTS','DEEP ECHO SERIES','GARAGE TRANSMISSIONS','DREAM TRANCE FILES','INTELLIGENT RHYTHMS','PROGRESSIVE BREAKS','ATMOSPHERIC JUNGLE'][i],code:'MD-'+String(i+1).padStart(2,'0'),paper:p[3],ink:i===1?'#13356b':'#273428',size:43,tracking:0,angle:0},stickers:{...common(),style:[0,7,3,6,5,8,4,1,9,10,8,2][i],p:[1+i%2,69,24,30+i%4*10],color:p[3],ink:p[0]}};}\nfunction points(n,fn){let p=[];for(let i=0;i\u003cn;i++){const q=fn(i/n*Math.PI*2,i);p.push(q.map(x=>+x.toFixed(2)).join(','));}return p.join(' ');}\nconst line=(x1,y1,x2,y2,c,w=1,o=1)=>`\u003cline x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"${c}\" stroke-width=\"${w}\" opacity=\"${o}\"/>`;\nconst circle=(x,y,r,c,sw=0,stroke='none',op=1)=>`\u003ccircle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"${c}\" stroke=\"${stroke}\" stroke-width=\"${sw}\" opacity=\"${op}\"/>`;\nfunction render(state,options={}){\nconst s=state, id=options.id||'md', q=x=>id+'-'+x, r=rng(s.seed), d=s.disc, sh=s.shell, la=s.label, st=s.stickers;\nconst cx=286,cy=288,R=226;let defs=[],body=[];\ndefs.push(`\u003cclipPath id=\"${q('body')}\">\u003cpath d=\"M65 40H526Q558 40 558 73V530Q558 550 538 550H58Q40 550 40 532V77Q40 40 65 40Z\"/>\u003c/clipPath>\u003cclipPath id=\"${q('disc')}\">\u003ccircle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\"/>\u003c/clipPath>`);\ndefs.push(`\u003clinearGradient id=\"${q('foil')}\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\".8\">\u003cstop stop-color=\"#c5d8ce\"/>\u003cstop offset=\".18\" stop-color=\"#627e91\"/>\u003cstop offset=\".27\" stop-color=\"#cbb5dd\"/>\u003cstop offset=\".33\" stop-color=\"#c1e6da\"/>\u003cstop offset=\".42\" stop-color=\"#f4e8af\"/>\u003cstop offset=\".5\" stop-color=\"#a7d1da\"/>\u003cstop offset=\".64\" stop-color=\"#d5b4cf\"/>\u003cstop offset=\".72\" stop-color=\"#9caed5\"/>\u003cstop offset=\".78\" stop-color=\"#bfebd0\"/>\u003cstop offset=\".87\" stop-color=\"#e7d5a5\"/>\u003cstop offset=\"1\" stop-color=\"#aec1b9\"/>\u003c/linearGradient>`);\ndefs.push(`\u003clinearGradient id=\"${q('glass')}\" x1=\"0\" y1=\"0\" x2=\".9\" y2=\"1\">\u003cstop stop-color=\"white\" stop-opacity=\".52\"/>\u003cstop offset=\".08\" stop-color=\"${sh.color}\" stop-opacity=\".1\"/>\u003cstop offset=\".46\" stop-color=\"${sh.color}\" stop-opacity=\".04\"/>\u003cstop offset=\".9\" stop-color=\"#091b1d\" stop-opacity=\".3\"/>\u003cstop offset=\"1\" stop-color=\"white\" stop-opacity=\".35\"/>\u003c/linearGradient>\u003clinearGradient id=\"${q('edge')}\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#efffeb\" stop-opacity=\".85\"/>\u003cstop offset=\".3\" stop-color=\"${sh.color}\" stop-opacity=\".5\"/>\u003cstop offset=\".53\" stop-color=\"#1a2c2b\" stop-opacity=\".8\"/>\u003cstop offset=\".8\" stop-color=\"${sh.color}\" stop-opacity=\".5\"/>\u003cstop offset=\"1\" stop-color=\"white\" stop-opacity=\".7\"/>\u003c/linearGradient>\u003cradialGradient id=\"${q('metal')}\">\u003cstop stop-color=\"#18201c\"/>\u003cstop offset=\".25\" stop-color=\"#8d9e99\"/>\u003cstop offset=\".6\" stop-color=\"#c1c8ba\"/>\u003cstop offset=\".71\" stop-color=\"#697b73\"/>\u003cstop offset=\".8\" stop-color=\"#d3ddcc\"/>\u003cstop offset=\"1\" stop-color=\"#34423c\"/>\u003c/radialGradient>`);\n['disc','shell','label','stickers'].forEach(key=>{const l=s[key],b=l.brightness/100;defs.push(`\u003cfilter id=\"${q(key+'-tone')}\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\" color-interpolation-filters=\"sRGB\">\u003cfeColorMatrix type=\"saturate\" values=\"${l.saturation/100}\"/>\u003cfeComponentTransfer>\u003cfeFuncR type=\"linear\" slope=\"${b}\"/>\u003cfeFuncG type=\"linear\" slope=\"${b}\"/>\u003cfeFuncB type=\"linear\" slope=\"${b}\"/>\u003c/feComponentTransfer>\u003c/filter>`);});\ndefs.push(`\u003cfilter id=\"${q('fog')}\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\">\u003cfeGaussianBlur stdDeviation=\"${sh.blur/14}\"/>\u003c/filter>\u003cfilter id=\"${q('shadow')}\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\">\u003cfeDropShadow dx=\"1\" dy=\"2\" stdDeviation=\"2\" flood-opacity=\".4\"/>\u003c/filter>`);\nlet art='';const [a,b,c,e]=d.p.map(Number), N=Math.round(8+a*.55), A=d.accent, C=d.color, rot=c*3.6;\nart+=circle(cx,cy,R,`url(#${q('foil')})`)+circle(cx,cy,R-3,C,0,'none',.88);\nif(d.program===0){for(let j=0;j\u003cN;j++){let rad=42+j*190/N;art+=`\u003cpolygon points=\"${points(150,t=>{const rr=rad+Math.sin(t*3+c*.05+j*.16)*b*.16+Math.cos(t*5+j*.2)*b*.08;return[cx+rr*Math.cos(t),cy+rr*Math.sin(t)];})}\" fill=\"none\" stroke=\"${j%7===0?'#f4f5dc':A}\" stroke-width=\"${j%7===0?1.7:.8}\" opacity=\"${.3+j/N*.55}\"/>`;}art+=`\u003cpath d=\"M83 411Q250 380 397 149\" fill=\"non
