<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合成器温室 · synth-plant</title><link rel="stylesheet" href="greenhouse.css?v=2"><script defer src="font-geometry.js"></script><script defer src="engine.js"></script><script defer src="greenhouse-audio.js?v=1"></script><script defer src="greenhouse.js?v=6"></script></head><body><header><a href="index.html">synth-plant</a><span>合成器温室 <small>01 / MODULAR GREENHOUSE</small></span><nav><button id="save">保存参数</button><button id="load">导入参数</button><button id="export">导出 SVG ↓</button></nav></header><main><section class="preview"><div class="preview-top"><span id="rack-title">机架 01 · 透光温室</span><button id="toggle-plants">隐藏植物 · 查看空机架</button><span id="status" role="status">点击植物舱位选择</span></div><div id="art"></div><div class="bottom"><button id="prev">← 上一音色</button><span id="name"></span><button id="next">下一音色 →</button></div><p>拖动植物调整舱内位置 · 滑块实时改变画面 · 点击植物或控制板试听 · 旋钮与推子为视觉造型</p><a id="plant-edit" href="index.html">打开所选植物的细节编辑 ↗</a></section><aside><div class="intro"><small>VISUAL LAB</small><h1>温室视觉工作台</h1><p>无描边的透光材质、模块机架与植物核心。全部以 SVG 绘制。</p></div><label class="plant-picker">机架方案<select id="rack-select"><option value="0">01 · 原始温室</option><option value="1">A · 双层植物阵列</option><option value="2">C · 错层植物阵列</option></select></label><div id="slots"></div><label class="plant-picker">当前舱位的音色 <select id="plant-select"></select></label><section class="plant-color"><label class="plant-picker">整架自动配色<select id="palette-mode"><option value="mono">同色系 · 深浅变化</option><option value="analogous">邻近色 · 冷暖变化</option><option value="mist">浅雾色 · 低饱和</option></select></label><div class="row"><label for="palette-base">配色主色</label><input id="palette-base" type="color" value="#87b6c1"></div><button id="harmonize" style="width:100%;margin-top:10px">自动配色整架植物</button><div class="row"><label for="scene-plant-color">单株颜色微调</label><input id="scene-plant-color" type="color" value="#ffd26a"></div><label style="display:flex;gap:7px;align-items:center;margin-top:12px"><input id="apply-atlas-color" type="checkbox"> 应用到图鉴</label><p id="color-status" class="note">只改变当前舱位</p><button id="reset-plant-color">恢复图鉴配色</button></section><details open class="individual-panel"><summary id="panel-label">选中面板</summary><label class="plant-picker">独立编辑对象<select id="panel-part"><option value="plant">植物舱体</option><option value="control">对应控制模块</option><option value="console">底座 LCD 面板</option></select></label><div id="panel-controls"></div><button id="reset-panel">恢复此面板的全局材质</button></details><button id="stop-sound">停止旋律</button><div id="controls"></div><button id="reset">恢复这张机架的初始设计</button><p class="note">三种机架分别保存调参，采用导轨、安装耳和螺钉连接。参数仅调整视觉，保存在当前浏览器。</p></aside></main><input id="file" type="file" accept="application/json" hidden></body></html>
